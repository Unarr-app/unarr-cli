name: CI

# Ported from the old Forgejo CI: test (race), vet, golangci-lint, a
# cross-compile matrix, and a coverage floor on engine+agent. Runs on
# GitHub-hosted runners (free for public repos).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A push trigger that does not fire cannot be replayed: `gh run rerun` needs a
  # run to exist, and re-running an older one re-tests the older commit. That is
  # not hypothetical — three consecutive pushes to main on 2026-08-06 (6a18671,
  # 0ea4fcc and the 1.10.1 release commit 2052156) produced pages-build runs and
  # no CI run at all, so v1.10.1 shipped without a single test having run on it.
  # workflow_dispatch is the only way to point this workflow at a given ref by
  # hand afterwards: `gh workflow run ci.yml --ref main` (dispatch takes a branch
  # or tag, never a bare SHA — tag the commit first if it is not a branch head).
  workflow_dispatch:
  # release.yml calls this before it publishes anything, so a red job stops the
  # release instead of being noticed afterwards. Calling it beats reading the
  # status of the run that the same push started: that run may not exist yet,
  # may still be going, or — measured on 2026-08-06 — may never have been
  # created at all, and "no run" must not read as "nothing failed".
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every OS to completion — a Windows-only path regression must not be
      # masked by an early Linux failure (and vice-versa).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # -race needs cgo; it's on by default on linux/darwin but Windows CI runners
      # historically lack a C toolchain, so drop -race there and rely on the
      # linux/darwin race legs for the detector coverage.
      - if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - if: runner.os == 'Windows'
        run: go test -count=1 ./...

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # test/e2e is behind `//go:build e2e`, so the `test` job above does not
      # match a single one of these files — the tag is the only way in, and this
      # job is the only thing that passes it. They drive the log ring over real
      # files (a foreign appending descriptor with RotateNow copy-truncating
      # underneath it) and run `unarr logs` as a real process, so they catch the
      # on-disk failures unit tests cannot: a rotation that strands the writer
      # on a dead inode, a slot that never gets dropped.
      #
      # Linux-only: what these assert is filesystem behaviour shared by every
      # target, and the one place it genuinely diverges — whether cmd.exe's `>>`
      # redirect is a real append handle — cannot be settled by a CI runner
      # anyway. That is measured on the VM harness in test/windows/.
      - run: make test-e2e

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # v7 is required for golangci-lint v2.x; action v6 only speaks the v1 line
      # ("invalid version string 'v2.x', golangci-lint v2 is not supported").
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  arch:
    name: Arch gate
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED, and the failure it prevents is SILENT. Both
      # halves of the gate diff against a base rev, and a shallow clone has none:
      #   - scripts/check-arch.sh then sees only working-tree changes, which on a
      #     clean checkout is ZERO files. Measured on a `clone --depth 1`:
      #     "✓ file-length gate: 0 changed .go file(s)", exit 0. A green that
      #     inspected nothing.
      #   - golangci-lint runs unscoped, so any legacy issue would surface as a
      #     regression on a PR that changed one line.
      # A green from an empty file set is worse than a red, so keep this at 0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Install the binary directly rather than via golangci-lint-action: that
      # action runs a lint pass of its own against .golangci.yml (correctness/
      # security, already covered by the `lint` job), and this job needs the
      # SEPARATE .golangci.arch.yml driven once per GOOS by `make arch`.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.11.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The base rev has to be computed per event, and getting it wrong is a
      # silent pass, not an error — both halves of the gate diff against it and
      # an empty diff inspects nothing.
      #
      #   PR:   `main` locally is the merge commit GitHub synthesised, not the
      #         branch point, so diffing against it would call the target
      #         branch's own commits "new". Use the real merge base.
      #   push: do NOT fall through to the Makefile's `origin/main`. On a push
      #         checkout leaves origin/main AT the pushed commit with HEAD
      #         detached on the same SHA, so base...HEAD is empty by
      #         construction — a green that looked at zero files. Use the
      #         commit that preceded the push instead.
      #
      # github.event.before is all-zeros on a branch's first push (nothing
      # preceded it); HEAD^ covers that and merge commits alike.
      - name: Architectural gate (per GOOS)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            BASE=$(git merge-base "$PR_BASE" HEAD)
          elif [ -n "$PUSH_BEFORE" ] && git rev-parse --verify --quiet "$PUSH_BEFORE^{commit}" >/dev/null; then
            BASE="$PUSH_BEFORE"
          else
            BASE=$(git rev-parse --verify --quiet 'HEAD^' || true)
          fi
          echo "arch base: ${BASE:-<none — gate runs unscoped>}"
          make arch ARCH_BASE="$BASE"

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # docker-entrypoint.sh is PID 1 of the published image and does the
      # privilege drop — a quoting slip there is a container that runs as root
      # or cannot start at all, and nothing else in CI executes it.
      # scripts/release.sh is deliberately not covered yet (pre-existing
      # findings); add it once cleaned up.
      - run: shellcheck docker-entrypoint.sh scripts/check-arch.sh scripts/download-ffmpeg-static.sh

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/unarr/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Threshold applies only to engine + agent — cmd is interactive UI
      # (config menus, daemon, auth browser) that is not unit-testable.
      - name: Test with coverage (engine + agent), enforce 50% floor
        run: |
          go test -race -coverprofile=coverage-core.out -covermode=atomic \
            ./internal/engine/... \
            ./internal/agent/...
          COVERAGE=$(go tool cover -func=coverage-core.out | grep ^total | awk '{print $3}' | tr -d '%')
          echo "Coverage on engine+agent: ${COVERAGE}%"
          awk -v c="$COVERAGE" 'BEGIN { if (c+0 < 50.0) { printf "ERROR: %.1f%% < 50%% floor\n", c+0; exit 1 } printf "OK: %.1f%% meets floor\n", c+0 }'
