name: desktop

# Builds the unarr-desktop system-tray companion on each OS. It is a SEPARATE
# binary from the headless `unarr` daemon (whose signed archives ship via
# goreleaser in release.yml, CGO_ENABLED=0). The tray's systray backend is
# pure-Go on Linux (DBus) and Windows (syscall) but needs CGO on macOS (Cocoa),
# so it cannot cross-compile from one box — hence this per-OS matrix.
#
# Publishing model ("todo hilado" with the CLI): when release.yml publishes the
# GitHub Release for a v* tag, the `release: published` trigger here builds the
# desktop binaries for every target in the matrix below AND ATTACHES THEM TO
# THAT SAME RELEASE as
#   unarr-desktop_<version>_<os>_<arch>[.exe]
# so /install.sh --desktop and install.ps1 resolve them with the exact same
# "latest release" logic they already use for the CLI. Older releases simply
# lack the assets — the installers warn and skip, never fail.
#
# SIGNING: goreleaser's checksums.txt only covers the CLI archives — these
# desktop assets are uploaded afterwards and would otherwise be unauthenticated.
# The `sign` job below therefore builds a desktop-specific manifest
# (checksums-desktop.txt + checksums-desktop.txt.sig, ed25519 with the SAME
# RELEASE_SIGNING_KEY secret goreleaser uses) and attaches it to the release.
# internal/upgrade verifies desktop binaries against that manifest with the
# compiled-in public key and refuses to install without it. Same invariant as
# the CLI: a missing secret FAILS the job — an unsigned release cannot ship.
#
# Push/PR runs (branch work) only upload workflow artifacts, no release touch.

on:
  push:
    branches: [main, feat/agent-desktop-tray]
    paths:
      - "cmd/unarr-desktop/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/desktop.yml"
    tags: ["desktop-v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      # gh release upload on the `release` event; read-only otherwise.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, cgo: "0", ext: "" }
          # arm64 legs are CGO-free (systray is pure Go on Linux/DBus and
          # Windows/syscall), so they cross-compile on the same runners — no
          # extra machine. Without them an arm64 NAS or a Snapdragon Windows
          # laptop got no tray at all: the installer resolves the asset by
          # <os>_<arch> and there was none to resolve.
          - { runner: ubuntu-latest, goos: linux, goarch: arm64, cgo: "0", ext: "" }
          # macos-13 was retired by GitHub (Dec 2025) — macos-15-intel is the
          # remaining Intel runner for darwin/amd64 builds.
          - { runner: macos-15-intel, goos: darwin, goarch: amd64, cgo: "1", ext: "" }
          - { runner: macos-latest, goos: darwin, goarch: arm64, cgo: "1", ext: "" }
          - { runner: windows-latest, goos: windows, goarch: amd64, cgo: "0", ext: ".exe" }
          - { runner: windows-latest, goos: windows, goarch: arm64, cgo: "0", ext: ".exe" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build unarr-desktop
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Version: CLI release tag vX.Y.Z or standalone desktop-vX.Y.Z tag
          # → X.Y.Z; branch builds fall back to the short SHA.
          TAG="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          case "$TAG" in
            desktop-v*) VERSION="${TAG#desktop-v}" ;;
            v*)         VERSION="${TAG#v}" ;;
            *)          VERSION="${GITHUB_SHA::7}" ;;
          esac
          ASSET="unarr-desktop_${VERSION}_${GOOS}_${GOARCH}${{ matrix.ext }}"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          # -H=windowsgui: GUI subsystem so the tray doesn't drag a console
          # window around on Windows.
          EXTRA=""
          [ "$GOOS" = "windows" ] && EXTRA="-H=windowsgui"
          go build -trimpath \
            -ldflags "-s -w $EXTRA -X main.version=${VERSION} ${SENTRY_DSN:+-X github.com/Unarr-app/unarr-cli/internal/sentry.dsn=${SENTRY_DSN}}" \
            -o "$ASSET" ./cmd/unarr-desktop
          ls -la "$ASSET"

      - name: Vet
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./cmd/unarr-desktop

      # Attach on the release event AND on a workflow_dispatch/push against a
      # v* tag — release.yml dispatches us on the tag (its GITHUB_TOKEN can't
      # fire the `release` event, GitHub's recursion guard). desktop-v* tags
      # (standalone tray builds) deliberately do NOT match: there is no CLI
      # release to attach to.
      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || github.ref_name }}" "$ASSET" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: unarr-desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: unarr-desktop_*
          if-no-files-found: error

  sign:
    name: sign desktop checksums
    # Hash every freshly built binary into checksums-desktop.txt, sign it
    # with the release ed25519 key (reusing scripts/sign-checksums — it is
    # artifact-agnostic: -key/-in/-out), and attach both files to the same
    # release. The artifacts hashed here are the exact bytes the build jobs
    # uploaded to the release (same files from the same job), so manifest and
    # assets can never drift.
    #
    # MUST match the "Attach to release" condition in build exactly. It used to
    # be `event_name == 'release'` alone, which never fired: release.yml
    # dispatches this workflow on the tag because its GITHUB_TOKEN cannot raise
    # a `release` event (GitHub's recursion guard). So 1.6.0 shipped the four
    # desktop binaries with no manifest, and every self-updater refused them
    # with "this release has no signed desktop assets".
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Require signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # Same invariant as goreleaser's `signs:` block: an unsigned release
          # must not ship. Fail loudly here instead of publishing desktop
          # assets the self-updater would refuse to install.
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is missing — refusing to publish unsigned desktop assets"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: unarr-desktop-*
          path: assets
          merge-multiple: true

      - name: Generate and sign checksums-desktop.txt
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # "<sha256>  <filename>" — the same format as goreleaser's
          # checksums.txt, parsed by internal/upgrade.
          (cd assets && sha256sum unarr-desktop_* > checksums-desktop.txt && cat checksums-desktop.txt)
          go run ./scripts/sign-checksums \
            -key "$RELEASE_SIGNING_KEY" \
            -in assets/checksums-desktop.txt \
            -out assets/checksums-desktop.txt.sig

      - name: Attach manifest to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same fallback as build's "Attach to release": on the dispatch path
          # release.yml uses, github.event.release is empty and the tag only
          # exists as github.ref_name — without it this uploaded to "".
          gh release upload "${{ github.event.release.tag_name || github.ref_name }}" \
            assets/checksums-desktop.txt \
            assets/checksums-desktop.txt.sig \
            --clobber
