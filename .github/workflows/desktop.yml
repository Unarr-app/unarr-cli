name: desktop

# Builds the unarr-desktop system-tray companion on each OS. It is a SEPARATE
# binary from the headless `unarr` daemon (whose signed archives ship via
# goreleaser in release.yml, CGO_ENABLED=0). The tray's systray backend is
# pure-Go on Linux (DBus) and Windows (syscall) but needs CGO on macOS (Cocoa),
# so it cannot cross-compile from one box — hence this per-OS matrix.
#
# Publishing model ("todo hilado" with the CLI): when release.yml publishes the
# GitHub Release for a v* tag, the `release: published` trigger here builds the
# four desktop binaries AND ATTACHES THEM TO THAT SAME RELEASE as
#   unarr-desktop_<version>_<os>_<arch>[.exe]
# so /install.sh --desktop and install.ps1 resolve them with the exact same
# "latest release" logic they already use for the CLI. Older releases simply
# lack the assets — the installers warn and skip, never fail.
#
# Push/PR runs (branch work) only upload workflow artifacts, no release touch.

on:
  push:
    branches: [main, feat/agent-desktop-tray]
    paths:
      - "cmd/unarr-desktop/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/desktop.yml"
    tags: ["desktop-v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      # gh release upload on the `release` event; read-only otherwise.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, cgo: "0", ext: "" }
          - { runner: macos-13, goos: darwin, goarch: amd64, cgo: "1", ext: "" }
          - { runner: macos-latest, goos: darwin, goarch: arm64, cgo: "1", ext: "" }
          - { runner: windows-latest, goos: windows, goarch: amd64, cgo: "0", ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build unarr-desktop
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Version: CLI release tag vX.Y.Z or standalone desktop-vX.Y.Z tag
          # → X.Y.Z; branch builds fall back to the short SHA.
          TAG="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          case "$TAG" in
            desktop-v*) VERSION="${TAG#desktop-v}" ;;
            v*)         VERSION="${TAG#v}" ;;
            *)          VERSION="${GITHUB_SHA::7}" ;;
          esac
          ASSET="unarr-desktop_${VERSION}_${GOOS}_${GOARCH}${{ matrix.ext }}"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          # -H=windowsgui: GUI subsystem so the tray doesn't drag a console
          # window around on Windows.
          EXTRA=""
          [ "$GOOS" = "windows" ] && EXTRA="-H=windowsgui"
          go build -trimpath \
            -ldflags "-s -w $EXTRA -X main.version=${VERSION} ${SENTRY_DSN:+-X github.com/Unarr-app/unarr-cli/internal/sentry.dsn=${SENTRY_DSN}}" \
            -o "$ASSET" ./cmd/unarr-desktop
          ls -la "$ASSET"

      - name: Vet
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./cmd/unarr-desktop

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: unarr-desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: unarr-desktop_*
          if-no-files-found: error
