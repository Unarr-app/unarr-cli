name: release

# Cuts a GitHub Release on every vX.Y.Z tag. This replaces the old self-hosted
# pipeline (Forgejo CI + `make ship` → Hetzner), which existed only while the
# project's GitHub account was unavailable. goreleaser cross-compiles the six
# targets, bundles ffmpeg, signs checksums.txt with the ed25519 release key, and
# uploads the archives + checksums + .sig as release assets — the self-updater
# fetches these directly from GitHub. A second job builds + pushes the multi-arch
# Docker image to Docker Hub, mirroring ship.sh's docker step.
#
# Required repo secrets:
#   RELEASE_SIGNING_KEY  ed25519 private key (base64) — signing FAILS the build if absent
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  Docker Hub push creds
#   SENTRY_DSN           telemetry DSN baked at build time (optional; empty = Sentry off)
#   HOMEBREW_TAP_TOKEN   PAT (repo scope) on Unarr-app/homebrew-tap — optional; when
#                        empty the goreleaser brew step skips upload (see .goreleaser.yml)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.2.2-beta"
        required: true

permissions:
  contents: write # create the GitHub Release + upload assets
  actions: write # dispatch desktop.yml so the tray binaries attach to the release

jobs:
  # NOTHING here publishes until the full CI matrix is green on the very commit
  # being released. This is a `uses:` and not a status-API lookup on purpose: the
  # CI run started by the same push may not exist yet when the tag arrives, may
  # still be running, or may never have been created (three pushes to main on
  # 2026-08-06 produced no CI run at all), and "no run found" must never be read
  # as "nothing failed". Calling the workflow means the answer always exists.
  #
  # It costs a second full matrix per release, ~6 minutes, which is the price of
  # the guarantee. v1.10.1 shipped without a single test having run on it, and
  # v1.10.2's own release commit was red on Windows while the assets uploaded.
  #
  # A reusable workflow always runs against the CALLER's ref, so this tests the
  # tag on a tag push. The workflow_dispatch path is the exception and the
  # goreleaser job refuses it below unless the two agree.
  ci:
    uses: ./.github/workflows/ci.yml

  goreleaser:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # The gate above ran against github.ref. When a re-release is dispatched
      # with an `tag` input, goreleaser checks out THAT tag instead — so unless
      # they are the same commit, what was tested is not what would ship. There
      # is no way to point a reusable workflow at another ref, so this refuses
      # rather than publishing something untested. Dispatch on the tag itself
      # (`gh workflow run release.yml --ref v1.2.3`) and the two agree.
      - name: The released ref must be the ref CI just tested
        if: github.event.inputs.tag != ''
        env:
          WANT: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          want_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${WANT}" --jq .sha)
          if [ "$want_sha" != "$GITHUB_SHA" ]; then
            echo "::error::CI ran on ${GITHUB_SHA} (${GITHUB_REF}) but the release" \
                 "would ship ${WANT} = ${want_sha}. Re-run with --ref ${WANT}."
            exit 1
          fi
          echo "tag ${WANT} is ${want_sha}, the commit CI tested."
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the changelog
          # On workflow_dispatch, check out the requested tag's commit (not the
          # default branch) so goreleaser's git-state check passes — otherwise it
          # aborts with "tag X was not made against commit <HEAD>". On tag push,
          # inputs.tag is empty → github.ref (the tag) is used.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Pin the Go toolchain to the exact go.mod version (same expression ship.sh
      # uses) so the GitHub build is byte-identical to the local Hetzner build —
      # reproducible releases. Single source of truth = go.mod's `go` line.
      - name: Pin Go toolchain from go.mod
        run: echo "GOTOOLCHAIN=go$(awk '/^go /{print $2; exit}' go.mod)" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Always defined (empty when the secret is unset) so .goreleaser.yml's
          # skip_upload guard can no-op the brew step instead of erroring.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # goreleaser publishes the Release with the workflow GITHUB_TOKEN, and
      # GitHub does NOT fire `release: published` for events created by another
      # workflow's token (recursion guard) — so desktop.yml would never run on
      # its own. workflow_dispatch via the API is the documented exception:
      # explicitly kick the per-OS tray build, which attaches
      # unarr-desktop_<ver>_<os>_<arch> assets to this same release.
      - name: Dispatch desktop companion build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run desktop.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.inputs.tag || github.ref_name }}"

  docker:
    runs-on: ubuntu-latest
    needs: goreleaser # only push an image for a release that built + signed cleanly
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the image from the released tag's source, not the default branch.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          MINOR="${VERSION%.*}"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            unarr/cli:${{ steps.meta.outputs.version }}
            unarr/cli:${{ steps.meta.outputs.minor }}
            unarr/cli:latest
