# Architectural / SOLID quality gate — analog of the web's ESLint architectural gate
# (max-lines 500 / complexity 15 / cognitive 15 / max-depth 4 / max-params 5 / no-dup).
#
# SEPARATE from .golangci.yml (correctness/security, full repo). This config holds ONLY
# the complexity/maintainability linters and is scoped to NEW/CHANGED code via
# `issues.new-from-rev` so the ~11 pre-existing god-files (hls.go 2302, stream_server.go
# 1980, daemon.go 1860, ...) are grandfathered — exactly like eslint-suppressions.json.
# New code MUST pass; legacy is not retro-broken.
#
# Run: `make arch` — NOT a bare `golangci-lint run -c .golangci.arch.yml ./...`.
# File-length (>500) is enforced separately by scripts/check-arch.sh (golangci has no
# file-line linter).
#
# WHY `make arch` AND NOT A BARE RUN: build-constrained files are invisible to a single
# pass. On a linux host the loader never parses a `//go:build windows` file, so ~35
# non-test files (the Windows daemon/launcher/reload paths, the launchd agent) are not
# analysed — and golangci prints "0 issues", which is indistinguishable from clean.
# Confirmed by planting a 7-param function in a _windows.go: default pass 0 issues,
# GOOS=windows 1 issue. `make arch` therefore loops the gate over ARCH_GOOS
# (linux windows darwin). Adding a `build-tags:` key here does NOT solve it — build tags
# and GOOS are separate axes, and the e2e suite stays exempt regardless (see below).
#
# NOT COVERED, DELIBERATELY: test code. The `path: _test\.go` rule below exempts every
# *_test.go from these linters, and scripts/check-arch.sh skips them for length too, so
# nothing under test/e2e/ is gated at all. Table-driven tests are long on purpose
# (upgrade_test.go 1236 lines); capping them would push authors toward fewer cases.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - funlen      # function length            (web: max-lines-per-function 150)
    - gocyclo     # cyclomatic complexity       (web: complexity 15)
    - gocognit    # cognitive complexity        (web: sonarjs/cognitive-complexity 15)
    - cyclop      # per-func + package cyclo backstop
    - nestif      # deeply nested if blocks     (web: max-depth 4)
    - dupl        # copy-paste clone detection  (web: sonarjs/no-identical-functions + jscpd)
    - maintidx    # maintainability index floor
    - revive      # used ONLY for argument-limit (web: max-params 5)
  settings:
    funlen:
      lines: 150
      statements: 80
      ignore-comments: true
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 15
    cyclop:
      max-complexity: 15
    nestif:
      min-complexity: 4
    dupl:
      threshold: 150
    maintidx:
      under: 20
    revive:
      # With an explicit rules list, revive runs ONLY these rules (no default ruleset).
      rules:
        - name: argument-limit
          arguments: [5]
  exclusions:
    paths:
      - dist
      - vendor
    rules:
      # Tests are exempt from architectural limits (table-driven tests get long/complex).
      - linters:
          - funlen
          - gocyclo
          - gocognit
          - cyclop
          - nestif
          - dupl
          - maintidx
          - revive
        path: _test\.go
      # Generated code is exempt.
      - linters:
          - funlen
          - gocyclo
          - gocognit
          - cyclop
          - nestif
          - dupl
          - maintidx
          - revive
        path: '(\.pb\.go|_gen\.go|mock_.*\.go)$'

issues:
  # Grandfather legacy: only flag issues introduced relative to the main branch.
  # `make arch` overrides this with --new-from-rev=$(ARCH_BASE), which resolves the
  # remote's actual name (origin vs github) first. This value is only the fallback for
  # a bare `golangci-lint run -c .golangci.arch.yml`. It is a local ref on purpose:
  # an unresolvable rev makes golangci-lint silently report the whole legacy codebase
  # instead of failing, so the ref must be one that always exists in a clone.
  new-from-rev: main
  max-issues-per-linter: 0
  max-same-issues: 0
